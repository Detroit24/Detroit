<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" width="320" height="600">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F5"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>
    <linearGradient id="btnGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Phone Body -->
  <rect x="10" y="10" width="300" height="580" rx="42" fill="#1C1A19" filter="url(#shadow)"/>
  <rect x="16" y="16" width="288" height="568" rx="36" fill="#383330"/>
  <rect x="20" y="20" width="280" height="560" rx="32" fill="url(#phoneBg)"/>

  <!-- Speaker & Camera Dynamic Island -->
  <rect x="110" y="28" width="100" height="18" rx="9" fill="#1C1A19"/>
  <circle cx="195" cy="37" r="4" fill="#2E2A28"/>

  <!-- Floral Top Decoration -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="45" fill="#EBD8C1" opacity="0.3"/>
    <path d="M-40 -15 C-20 -35 20 -35 40 -15 C25 5 -25 5 -40 -15 Z" fill="#D4AF37" opacity="0.4"/>
    <circle cx="0" cy="-5" r="14" fill="#C5A059" opacity="0.6"/>
    <!-- Leaves -->
    <path d="M-25 10 Q-35 -10 -15 -25 Q-5 -10 -25 10 Z" fill="#9DAA8B"/>
    <path d="M25 10 Q35 -10 15 -25 Q5 -10 25 10 Z" fill="#9DAA8B"/>
  </g>

  <!-- Invitation Content -->
  <text x="160" y="210" text-anchor="middle" font-family="'Great Vibes', 'Playfair Display', cursive, serif" font-size="20" fill="#8C7A6B" font-style="italic">The Wedding Of</text>
  
  <text x="160" y="255" text-anchor="middle" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#2C241E">Andika</text>
  <text x="160" y="285" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="24" fill="#B8860B">&amp;</text>
  <text x="160" y="325" text-anchor="middle" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#2C241E">Salsabila</text>

  <line x1="90" y1="355" x2="230" y2="355" stroke="#D1C2B2" stroke-width="1"/>
  <text x="160" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#75675C">SABTU, 14 DESEMBER 2024</text>
  <line x1="90" y1="395" x2="230" y2="395" stroke="#D1C2B2" stroke-width="1"/>

  <!-- Button Buka Undangan -->
  <g transform="translate(85, 435)">
    <rect x="0" y="0" width="150" height="42" rx="21" fill="url(#btnGold)"/>
    <text x="75" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Buka Undangan</text>
  </g>

  <!-- Down chevron hint -->
  <path d="M153 505 L160 513 L167 505" fill="none" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>

  <!-- Floral Bottom Border -->
  <g transform="translate(160, 545)" opacity="0.6">
    <ellipse cx="0" cy="10" rx="60" ry="15" fill="#E8D5BE" opacity="0.4"/>
    <circle cx="-30" cy="5" r="8" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="10" fill="#B8860B"/>
    <circle cx="30" cy="5" r="8" fill="#D4AF37"/>
  </g>
</svg>
